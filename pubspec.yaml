publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  fl_chart: ^1.3.0
  pdf: ^3.12.0
  csv: ^8.0.0
  share_plus: ^13.3.1
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
