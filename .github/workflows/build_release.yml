name: Build and release Android APK

on:
  push:
    branches:
      - main
      - master
      - 'jules-**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Require Android release signing secrets
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Add all four Android signing secrets in GitHub repository Settings > Secrets and variables > Actions before publishing a release."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/speny-upload-key.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/speny-upload-key.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare Android release asset
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/Speny-Android.apk

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speny-Android-APK
          path: release-assets/Speny-Android.apk
          if-no-files-found: error

  release:
    name: Publish Android APK release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs:
      - test
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Speny-Android-APK
          path: release-assets

      - name: Select release tag
        id: release_tag
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml)
          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.name }}
          name: Speny ${{ steps.release_tag.outputs.name }} (v${{ steps.release_tag.outputs.app_version }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          draft: false
          prerelease: false
          files: release-assets/Speny-Android.apk
          body: |
            **Speny v${{ steps.release_tag.outputs.app_version }}**

            Automated Android APK build. Install `Speny-Android.apk` on an Android device.
            Signed with the Android signing key configured in this repository's Actions secrets.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
